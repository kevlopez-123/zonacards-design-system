# Sistema de diseño nativo · Android: verifica que lo generado esté al día, compila, prueba (dominio, componentes,
# accesibilidad, contraste y capturas de referencia) y publica el APK del catálogo para instalar en teléfonos de prueba.
name: Nativo Android

on:
  pull_request:
    paths: ['projects/zonacards-ui/**', 'projects/zonacards-native/**', 'scripts/build-native*.mjs', '.github/workflows/native-android.yml']
  push:
    branches: [main]
    paths: ['projects/zonacards-ui/**', 'projects/zonacards-native/**', 'scripts/build-native*.mjs']
  workflow_dispatch:
    inputs:
      record:
        description: 'Grabar capturas de referencia nuevas (-Psnapshots=record) y subirlas como artefacto'
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25.4.0, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Los archivos nativos se generan desde @zonacards/ui: si alguien cambió tokens, íconos o textos sin regenerar, falla.
      - name: Generar y comprobar que no hay diferencias
        run: |
          npm run native
          git diff --exit-code -- projects/zonacards-native || (echo "::error::Corre npm run native y sube los archivos generados" && exit 1)
      # Pesos, opacidad de deshabilitado, tamaños de ícono y umbrales de ancho con su token, no con un número suelto.
      - name: Valores sueltos donde hay token
        run: |
          node scripts/check-token-usage.mjs --self-test
          node scripts/check-token-usage.mjs --scope=native
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y probar
        working-directory: projects/zonacards-native/android
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain ${{ inputs.record && '-Psnapshots=record' || '' }}
      - name: Capturas que cambiaron
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-fallidas
          path: projects/zonacards-native/android/catalog/build/snapshots-failed/
      - name: Capturas grabadas
        if: inputs.record
        uses: actions/upload-artifact@v4
        with:
          name: capturas-grabadas
          path: projects/zonacards-native/android/catalog/src/test/snapshots/
      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: projects/zonacards-native/android/*/build/reports/tests/
      - name: APK del catálogo
        uses: actions/upload-artifact@v4
        with:
          name: zonacards-catalogo-apk
          path: projects/zonacards-native/android/catalog/build/outputs/apk/debug/catalog-debug.apk
      # Distribución a teléfonos de prueba: requiere los secretos FIREBASE_APP_ID y FIREBASE_SERVICE_ACCOUNT (JSON de la cuenta de servicio).
      - name: Firebase App Distribution
        if: github.ref == 'refs/heads/main' && env.FIREBASE_APP_ID != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > sa.json
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/sa.json"
          npx firebase-tools appdistribution:distribute projects/zonacards-native/android/catalog/build/outputs/apk/debug/catalog-debug.apk \
            --app "$FIREBASE_APP_ID" --groups "diseño" --release-notes "Catálogo ${GITHUB_SHA::7}"
        shell: bash
