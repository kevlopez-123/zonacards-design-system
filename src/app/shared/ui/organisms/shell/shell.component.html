<a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-50 focus:rounded-sm focus:bg-surface focus:px-3 focus:py-2">{{ 'app.saltar' | transloco }}</a>

<header class="sticky top-0 z-40 border-b border-border bg-[color-mix(in_srgb,var(--surface)_92%,transparent)] backdrop-blur">
  <div class="flex h-topbar items-center gap-1 px-3 sm:gap-2 sm:px-4 lg:gap-3 [&_zc-notifications_button]:max-sm:size-target-sm">
    <button zcButton variant="ghost" size="icon" class="md:hidden max-sm:size-target-sm" [attr.aria-label]="'nav.abrir' | transloco" [attr.aria-expanded]="sb.overlayOpen()" (click)="sb.open()">
      <zc-icon name="s:hamburger-menu" />
    </button>
    <a routerLink="/inicio" class="flex min-w-0 shrink-0 items-center gap-3 no-underline text-fg" [attr.aria-label]="('app.nombre' | transloco) + ', ' + ('nav.inicio' | transloco)">
      <span class="grid size-9 place-items-center rounded-[10px] bg-secondary font-bold text-on-secondary" aria-hidden="true">Z</span>
      <span class="hidden truncate font-semibold sm:inline">{{ 'app.nombre' | transloco }}</span>
    </a>
    <span class="flex-1"></span>
    <!-- Orden de index.html: país, idioma, buscar, notificaciones, tema; luego aprobaciones y usuario. -->
    <zc-country-switcher [value]="locale.country()" (valueChange)="locale.country.set($event)" />
    <zc-menu class="max-sm:hidden" [label]="langLabel()" [triggerText]="locale.lang().toUpperCase()" leadIcon="s:global" [items]="langItems()" (select)="setLang($event)" />
    <button zcButton variant="outline" size="sm" class="max-md:hidden" [attr.aria-label]="'top.buscar.boton' | transloco" (click)="palette.open()">
      <zc-icon name="s:magnifier" [size]="16" />{{ 'top.buscar.corto' | transloco }}<kbd zcKbd>Ctrl K</kbd>
    </button>
    <button zcButton variant="ghost" size="icon" class="md:hidden max-sm:size-target-sm" [attr.aria-label]="'top.buscar.boton' | transloco" (click)="palette.open()"><zc-icon name="s:magnifier" /></button>
    <zc-notifications [items]="notifications.items()" (itemsChange)="notifications.persist($event)" (open)="openNotification($event)" (seeAll)="seeAllNotifications()" />
    <div class="hidden gap-1 rounded-full bg-surface-2 p-1 lg:inline-flex" role="radiogroup" aria-label="Tema">
      @for (m of modes; track m.v) {
        <button type="button" role="radio" [attr.aria-checked]="theme.mode() === m.v" [attr.aria-label]="m.key | transloco" (click)="theme.mode.set(m.v)"
          class="grid h-10 w-11 place-items-center rounded-full text-muted aria-checked:bg-surface aria-checked:text-fg aria-checked:shadow-sm">
          <zc-icon [name]="m.icon" [size]="16" />
        </button>
      }
    </div>
    @if (approvals.visible()) {
      <a zcButton variant="ghost" size="icon" class="relative max-sm:hidden" routerLink="/aprobaciones" [attr.aria-label]="approvalsLabel()" [zcTooltip]="approvalsLabel()">
        <zc-icon name="s:checklist-minimalistic" />
        @if (approvals.count()) {
          <span class="num absolute top-1 right-0.5 inline-grid h-[18px] min-w-[18px] place-items-center rounded-full bg-danger px-1 text-[11px] font-semibold leading-none text-white dark:text-black" aria-hidden="true">{{ approvals.count() }}</span>
        }
      </a>
    }
    @if (session.user(); as u) {
      @if (demo) {
        <zc-menu [label]="userLabel()" [triggerText]="initials()" [items]="userItems()" (select)="switchUser($event)" />
      } @else {
        <span class="grid size-10 place-items-center rounded-full bg-surface-3 text-sm font-semibold" [zcTooltip]="u.name + ' · ' + u.role">{{ initials() }}</span>
      }
    }
  </div>
</header>

<div class="grid min-h-[calc(100dvh-var(--topbar-h))] grid-cols-[minmax(0,1fr)] md:grid-cols-[auto_minmax(0,1fr)]">
  <zc-sidebar #sb [groups]="nav()" />
  <main id="contenido" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1200px] px-4 py-6 md:px-8">
    <router-outlet />
  </main>
</div>

<zc-toaster />
<zc-command-palette #palette [commands]="commands()" (run)="runCommand($event)" />
